<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok-Style Navbar</title>
  <style>
    /* General Reset */
    body, ul, li, a {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #010101;
      color: white;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: linear-gradient(90deg, #ff0050, #0055ff);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .logo a {
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      color: white;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 15px;
    }

    .nav-links a {
      text-decoration: none;
      font-size: 18px;
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .nav-links a:hover {
      background-color: white;
      color: #ff0050;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <a href="#">TikTocker</a>
    </div>
    <ul class="nav-links">
      <li><a href="home.html">Home</a></li>
      <li><a href="login.html">Sign In</a></li>
      <li><a href="register.php">Sign Up</a></li>
    </ul>
  </nav>
</body>
</html>
